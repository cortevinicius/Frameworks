<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="Projeto React moderno desenvolvido por Vinícius Côrte"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>Projeto React | Vinícius Côrte</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
        color: white;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 40px;
        max-width: 700px;
      }

      .logo {
        width: 90px;
        height: 90px;
        margin: 0 auto 24px;
        border-radius: 50%;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        font-weight: bold;
        box-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 16px;
      }

      p {
        font-size: 1.1rem;
        line-height: 1.7;
        color: #cbd5e1;
        margin-bottom: 32px;
      }

      .btn {
        display: inline-block;
        padding: 14px 28px;
        border-radius: 12px;
        text-decoration: none;
        color: white;
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        font-weight: bold;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 25px rgba(37, 99, 235, 0.35);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(37, 99, 235, 0.45);
      }

      .footer {
        margin-top: 40px;
        font-size: 0.9rem;
        color: #94a3b8;
      }

      .circle {
        position: absolute;
        border-radius: 50%;
        filter: blur(60px);
        opacity: 0.35;
      }

      .c1 {
        width: 260px;
        height: 260px;
        background: #2563eb;
        top: -80px;
        left: -80px;
      }

      .c2 {
        width: 320px;
        height: 320px;
        background: #7c3aed;
        bottom: -120px;
        right: -120px;
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 2.2rem;
        }

        p {
          font-size: 1rem;
        }

        .container {
          padding: 24px;
        }
      }
    </style>
  </head>

  <body>
    <div class="circle c1"></div>
    <div class="circle c2"></div>

    <div class="container">
      <div class="logo">V</div>

      <h1>Bem-vindo ao meu projeto React</h1>

      <p>
        Interface moderna, responsiva e preparada para evoluir com componentes,
        rotas, integração com APIs e muito mais.
      </p>

      <a class="btn" href="https://github.com/cortevinicius" target="_blank">
        Ver GitHub
      </a>

      <div class="footer">
        Desenvolvido por Vinícius Côrte • React + HTML + CSS
      </div>
    </div>

    <noscript>Você precisa habilitar o JavaScript para executar esta aplicação.</noscript>

    <div id="root"></div>
  </body>
</html>
