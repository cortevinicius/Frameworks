<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jogo da Cobrinha</title>
  <style>
    body{
      margin:0;
      background:#111827;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      color:white;
      font-family:Arial;
      flex-direction:column;
    }
    canvas{
      background:black;
      border:4px solid #22c55e;
      border-radius:10px;
    }
  </style>
</head>
<body>

<h1>🐍 Jogo da Cobrinha</h1>
<canvas id="jogo" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById('jogo');
const ctx = canvas.getContext('2d');

let x = 200, y = 200;
let dx = 20, dy = 0;
let comida = {x:100, y:100};
let pontos = 0;
let cobra = [{x,y}];

document.addEventListener('keydown', e => {
  if(e.key==='ArrowLeft' && dx===0){dx=-20;dy=0;}
  if(e.key==='ArrowRight' && dx===0){dx=20;dy=0;}
  if(e.key==='ArrowUp' && dy===0){dx=0;dy=-20;}
  if(e.key==='ArrowDown' && dy===0){dx=0;dy=20;}
});

function loop(){
  ctx.fillStyle='black';
  ctx.fillRect(0,0,400,400);

  x += dx;
  y += dy;

  if(x<0)x=380;
  if(x>380)x=0;
  if(y<0)y=380;
  if(y>380)y=0;

  cobra.unshift({x,y});

  if(x===comida.x && y===comida.y){
    pontos++;
    comida = {
      x: Math.floor(Math.random()*20)*20,
      y: Math.floor(Math.random()*20)*20
    };
  }else{
    cobra.pop();
  }

  ctx.fillStyle='red';
  ctx.fillRect(comida.x, comida.y, 20, 20);

  ctx.fillStyle='#22c55e';
  cobra.forEach(p => ctx.fillRect(p.x,p.y,20,20));

  ctx.fillStyle='white';
  ctx.fillText('Pontos: '+pontos, 10, 15);
}

setInterval(loop,120);
</script>

</body>
</html>
